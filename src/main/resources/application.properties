spring.application.name=business-automation-platform

server.port=${PORT:8080}
# Error details are produced by GlobalExceptionHandler; never leak them from the container.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ----------------------------------------------------------------- datasource
# Every credential is supplied through the environment; nothing is committed.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/platform}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:platform}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# ----------------------------------------------------------------------- jpa
# Flyway owns the schema. Hibernate never creates or alters it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.show-sql=false

# ------------------------------------------------------------------ flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ---------------------------------------------------------------- jackson
# Jackson 3 (the default in Spring Boot 4) already writes java.time values as
# ISO-8601 strings, so no date-formatting overrides are needed here.
spring.jackson.default-property-inclusion=non_null

# --------------------------------------------------------------- multipart
spring.servlet.multipart.max-file-size=${PLATFORM_STORAGE_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${PLATFORM_STORAGE_MAX_REQUEST_SIZE:12MB}
spring.servlet.multipart.enabled=true

# ----------------------------------------------------------------- platform
platform.name=${PLATFORM_NAME:Business Automation Platform}
platform.short-name=${PLATFORM_SHORT_NAME:Platform}
platform.version=${PLATFORM_VERSION:1.0.0}
platform.support-email=${PLATFORM_SUPPORT_EMAIL:support@example.com}

# ----------------------------------------------------------------- security
# No default secret on purpose: JwtService fails fast when this is missing, so a
# deployment can never start with a well-known signing key.
platform.security.jwt.secret=${PLATFORM_SECURITY_JWT_SECRET:}
platform.security.jwt.access-token-expiration=${PLATFORM_JWT_ACCESS_EXPIRATION:PT30M}
platform.security.jwt.refresh-token-expiration=${PLATFORM_JWT_REFRESH_EXPIRATION:P7D}
platform.security.jwt.issuer=${PLATFORM_JWT_ISSUER:business-automation-platform}
platform.security.bcrypt-strength=${PLATFORM_BCRYPT_STRENGTH:10}

# Override to make additional endpoints reachable without a token, e.g. for a
# health check on a private network.
platform.security.public-endpoints=/api/auth/login,/api/auth/refresh,/api/auth/logout,/api/auth/forgot-password,/api/auth/reset-password,/api/public/**,/actuator/health,/actuator/info,/error

# ------------------------------------------------------------------- cors
platform.security.cors.allowed-origins=${PLATFORM_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4000}
platform.security.cors.allow-credentials=true

# ----------------------------------------------------------------- storage
platform.storage.type=local
platform.storage.location=${PLATFORM_STORAGE_LOCATION:./data/uploads}
platform.storage.max-file-size=${PLATFORM_STORAGE_MAX_FILE_SIZE:10MB}

# --------------------------------------------------------------------- mail
# Off by default: the template must not require an SMTP server to start.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
platform.mail.enabled=${PLATFORM_MAIL_ENABLED:false}

# ------------------------------------------------------------------ seeding
platform.seed.enabled=${PLATFORM_SEED_ENABLED:true}
platform.seed.admin-username=${PLATFORM_SEED_ADMIN_USERNAME:admin}
platform.seed.admin-email=${PLATFORM_SEED_ADMIN_EMAIL:admin@example.com}
platform.seed.admin-first-name=${PLATFORM_SEED_ADMIN_FIRST_NAME:Platform}
platform.seed.admin-last-name=${PLATFORM_SEED_ADMIN_LAST_NAME:Administrator}
# Intentionally empty. Without it no account is created and the log explains why.
platform.seed.admin-password=${PLATFORM_SEED_ADMIN_PASSWORD:}
platform.seed.organization-name=${PLATFORM_ORGANIZATION_NAME:My Company}

# ----------------------------------------------------------------- logging
logging.level.company.backend=${LOG_LEVEL_BACKEND:INFO}
logging.level.org.springframework.security=INFO
