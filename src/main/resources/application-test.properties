# Test profile.
#
# The schema is generated by Hibernate from the entities rather than by Flyway:
# it keeps tests fast, gives each test a clean database, and - most usefully -
# fails loudly if an entity mapping stops being buildable. The Flyway scripts are
# verified separately by MigrationScriptTest, which executes them against H2.
spring.config.activate.on-profile=test

spring.datasource.url=jdbc:h2:mem:platform-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

platform.security.jwt.secret=test-only-signing-key-not-used-anywhere-else-32b
platform.seed.enabled=true
platform.seed.admin-password=TestAdmin123!
platform.seed.admin-email=admin@test.local

platform.storage.location=./target/test-uploads
platform.storage.max-file-size=1MB

logging.level.company.backend=WARN
logging.level.org.springframework=WARN

