# Development profile. Only ever used locally - the values below are public by design.
spring.config.activate.on-profile=dev

# H2 in PostgreSQL compatibility mode so a developer needs no database server.
spring.datasource.url=jdbc:h2:mem:platform;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway owns the schema in every profile; H2 only stands in for PostgreSQL locally.
spring.jpa.hibernate.ddl-auto=none

platform.security.jwt.secret=dev-only-insecure-signing-key-change-me-please-32b
platform.seed.admin-password=Admin123!

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.company.backend=DEBUG